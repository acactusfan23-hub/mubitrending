name: Update MUBI UK Trending

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape MUBI and update MDBList
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          MDBLIST_LIST_NAME: MUBI UK Trending
        run: python mubi_trending.py
      - name: Commit snapshot
        run: |
          git config user.name 'mubi-trending-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || git commit -m 'Update MUBI UK Trending snapshot'
          git push
