name: Probe MUBI Sources

on:
  push:
    paths:
      - 'probe_mubi_sources.py'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe candidate MUBI sources only
        run: |
          mkdir -p data
          python probe_mubi_sources.py | tee data/probe.log
      - name: Commit probe output
        run: |
          git config user.name 'mubi-source-probe'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/probe.log
          git diff --cached --quiet || git commit -m 'Update MUBI source probe output'
          git push
